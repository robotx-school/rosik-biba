<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Bibika Robot</title>
  <style>
    body{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#2c3e50;font-family:Arial,sans-serif;color:#ecf0f1;touch-action:none;overflow:hidden}
    #layout{display:grid;grid-template-columns:minmax(280px,45vw) 320px;gap:20px;align-items:center;width:min(96vw,1120px)}
    video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#111;border-radius:12px;box-shadow:0 0 18px rgba(0,0,0,.45)}
    #joystick_container{width:220px;height:220px;background:#34495e;border-radius:50%;position:relative;border:3px solid #7f8c8d;box-shadow:0 0 15px rgba(0,0,0,.3);margin:0 auto 18px}
    #joystick_handle{width:76px;height:76px;background:#95a5a6;border-radius:50%;position:absolute;top:calc(50% - 38px);left:calc(50% - 38px);cursor:grab;border:2px solid #bdc3c7;box-shadow:inset 0 0 10px rgba(0,0,0,.2)}
    .status{margin-top:8px;font-size:1em;background:#34495e;padding:8px 15px;border-radius:5px;box-shadow:0 0 10px rgba(0,0,0,.2);min-width:280px;text-align:center;font-variant-numeric:tabular-nums}
    .instructions{margin-bottom:16px;font-size:.9em;color:#bdc3c7;text-align:center}.online{color:#2ecc71}.offline{color:#e74c3c}
    #power_button{display:block;width:100%;margin:10px 0;padding:12px;border:0;border-radius:6px;background:#d35400;color:#fff;font:600 1em Arial,sans-serif;cursor:pointer}
    #power_button:disabled{opacity:.45;cursor:not-allowed}
    #power_button:focus-visible{outline:3px solid #ecf0f1;outline-offset:3px}
    .gamepad-active #layout{display:flex;flex-direction:column;gap:14px;width:min(96vw,1400px)}
    .gamepad-active #joystick_container{display:none}
    .gamepad-active .camera{display:block;width:100%;order:1}
    .gamepad-active .camera video{display:block;width:100%;max-height:78vh}
    .gamepad-active .controls{order:2;width:min(100%,520px)}
    .gamepad-active video{max-height:78vh}
    @media(max-width:800px){#layout{grid-template-columns:1fr}video{max-height:42vh}.controls{order:2}.camera{order:1}}
  </style>
</head>
<body>
  <div id="layout">
    <div class="camera"><video id="camera" autoplay playsinline muted></video></div>
    <div class="controls">
      <div class="instructions">Управляйте роботом джойстиком или контроллером Steam Deck.</div>
      <div id="joystick_container"><div id="joystick_handle"></div></div>
      <button id="power_button" type="button" disabled>Toggle motor power</button>
      <div class="status" id="power_status" role="status" aria-live="polite">Power relay: unknown (on/off not sensed)</div>
      <div class="status" id="velocity">Linear: 0.00 m/s, Angular: 0.00 rad/s</div>
      <div class="status offline" id="control_status">Control WS: Offline</div>
      <div class="status offline" id="serial_status">ESP Serial: Offline</div>
      <div class="status offline" id="gamepad_status">Gamepad: Offline</div>
      <div class="status offline" id="camera_status">Camera: Offline</div>
    </div>
  </div>
  <script>
    const LINEAR_LIMIT = {{ .LinearLimit }};
    const ANGULAR_LIMIT = {{ .AngularLimit }};
    const ROBOT_ID = {{ .RobotID }};
    const ICE_SERVERS = {{ .ICEServersJSON }};
    const ICE_TRANSPORT_POLICY = {{ if .RelayOnly }}'relay'{{ else }}'all'{{ end }};
    const SEND_INTERVAL = 80;
    const box = document.getElementById('joystick_container');
    const knob = document.getElementById('joystick_handle');
    const velocity = document.getElementById('velocity');
    const controlStatus = document.getElementById('control_status');
    const serialStatus = document.getElementById('serial_status');
    const gamepadStatus = document.getElementById('gamepad_status');
    const cameraStatus = document.getElementById('camera_status');
    const video = document.getElementById('camera');
    const powerButton = document.getElementById('power_button');
    const powerStatus = document.getElementById('power_status');
    let relaySerialOnline=false,relayBusy=false,relayCooldown=false,relayCooldownTimer;
    let controlWS, cameraWS, pc, controlReconnectTimer, cameraReconnectTimer, cameraWatchdog, sendTimer, gamepadSendTimer, lastVideoTime=0, stalledVideoChecks=0, gamepadLayoutActive=false, gamepadLoopStarted=false, gamepadMoving=false;
    let dragging = false, linear = 0, angular = 0, rect = box.getBoundingClientRect();
    const center = box.offsetWidth / 2, handleRadius = knob.offsetWidth / 2, maxDisplacement = center - handleRadius;
    const keys = new Set();

    function status(el, text, ok){const className='status '+(ok?'online':'offline');if(el.textContent===text&&el.className===className)return;el.textContent=text;el.className=className}
    function showVelocity(){const text='Linear: '+linear.toFixed(2)+' m/s, Angular: '+angular.toFixed(2)+' rad/s';if(velocity.textContent!==text)velocity.textContent=text}
    function send(){if(controlWS&&controlWS.readyState===WebSocket.OPEN)controlWS.send(JSON.stringify({type:'control',linear,angular}))}
    function stop(){linear=0;angular=0;showVelocity();knob.style.left=(center-handleRadius)+'px';knob.style.top=(center-handleRadius)+'px';send()}
    function updatePowerButton(){powerButton.disabled=!(controlWS&&controlWS.readyState===WebSocket.OPEN&&relaySerialOnline)||relayBusy||relayCooldown}
    function showPowerStatus(state){const labels={unknown:'unknown (on/off not sensed)',ready:'ready (on/off not sensed)',pending:'pulse requested',sent:'pulse sent; awaiting ESP32',pulsing:'active for 500 ms',done:'pulse complete (on/off not sensed)',busy:'busy; please wait',offline:'offline (on/off not sensed)',expired:'request expired; no pulse sent',timeout:'no confirmation; check power before retrying',uncertain:'connection lost; check power before retrying'};relayBusy=['pending','sent','pulsing','busy'].includes(state);powerStatus.textContent='Power relay: '+(labels[state]||labels.unknown);updatePowerButton()}
    powerButton.addEventListener('click',()=>{if(powerButton.disabled)return;stop();relayCooldown=true;showPowerStatus('pending');clearTimeout(relayCooldownTimer);try{controlWS.send(JSON.stringify({type:'power_pulse'}))}catch(error){showPowerStatus('uncertain')}relayCooldownTimer=setTimeout(()=>{relayCooldown=false;if(relayBusy)showPowerStatus('timeout');updatePowerButton()},3000)});
    function updateRect(){rect=box.getBoundingClientRect()}
    function coords(event){if(event.touches&&event.touches.length>0)return{clientX:event.touches[0].clientX,clientY:event.touches[0].clientY};return{clientX:event.clientX,clientY:event.clientY}}
    function updateJoystick(event){if(!dragging)return;const c=coords(event);let dx=c.clientX-rect.left-center,dy=c.clientY-rect.top-center;const distance=Math.sqrt(dx*dx+dy*dy);if(distance>maxDisplacement){dx=dx/distance*maxDisplacement;dy=dy/distance*maxDisplacement}knob.style.left=(center+dx-handleRadius)+'px';knob.style.top=(center+dy-handleRadius)+'px';linear=-(dy/maxDisplacement)*LINEAR_LIMIT;angular=-(dx/maxDisplacement)*ANGULAR_LIMIT;showVelocity()}
    function startDrag(event){dragging=true;knob.style.cursor='grabbing';updateRect();updateJoystick(event);send();clearInterval(sendTimer);sendTimer=setInterval(send,SEND_INTERVAL);if(event.cancelable)event.preventDefault()}
    function drag(event){updateJoystick(event);if(dragging&&event.cancelable)event.preventDefault()}
    function endDrag(event){if(!dragging)return;dragging=false;knob.style.cursor='grab';clearInterval(sendTimer);sendTimer=null;stop();if(event&&event.cancelable)event.preventDefault()}
    function applyDeadzone(value){const deadzone=0.12;if(Math.abs(value)<=deadzone)return 0;const sign=Math.sign(value);return sign*((Math.abs(value)-deadzone)/(1-deadzone))}
    function pollGamepad(){const pads=navigator.getGamepads?navigator.getGamepads():[];let pad=null;for(const candidate of pads){if(candidate&&candidate.connected){pad=candidate;break}}const hasPad=!!pad;if(hasPad!==gamepadLayoutActive){gamepadLayoutActive=hasPad;document.body.classList.toggle('gamepad-active',hasPad)}status(gamepadStatus,hasPad?'Gamepad: '+(pad.id||'Connected'):'Gamepad: Offline',hasPad);const leftY=pad?applyDeadzone(pad.axes[1]||0):0,rightX=pad?applyDeadzone(pad.axes[2]||0):0;const gamepadInput=Math.abs(leftY)>0.001||Math.abs(rightX)>0.001;const keyboardLinear=(keys.has('w')||keys.has('ArrowUp')?1:0)-(keys.has('s')||keys.has('ArrowDown')?1:0),keyboardAngular=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);if(!dragging){linear=(gamepadInput?-leftY:keyboardLinear)*LINEAR_LIMIT;angular=(gamepadInput?-rightX:keyboardAngular)*ANGULAR_LIMIT;showVelocity();const moving=gamepadInput||keys.size;if(moving&&!gamepadSendTimer)gamepadSendTimer=setInterval(send,SEND_INTERVAL);if(!moving&&gamepadSendTimer){clearInterval(gamepadSendTimer);gamepadSendTimer=null;if(gamepadMoving)send()}gamepadMoving=moving}requestAnimationFrame(pollGamepad)}
    window.addEventListener('keydown',event=>{const key=event.key;if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)){keys.add(key);event.preventDefault()}});
    window.addEventListener('keyup',event=>{if(keys.delete(event.key))event.preventDefault()});
    window.addEventListener('gamepadconnected',()=>{});
    window.addEventListener('gamepaddisconnected',()=>{if(!Array.from(navigator.getGamepads?navigator.getGamepads():[]).some(p=>p&&p.connected)){document.body.classList.remove('gamepad-active');clearInterval(gamepadSendTimer);gamepadSendTimer=null;stop()}});
    const wsScheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    function connectControl(){clearTimeout(controlReconnectTimer);controlWS=new WebSocket(wsScheme+location.host+'/ws/control?robotId='+encodeURIComponent(ROBOT_ID));controlWS.onopen=()=>{status(controlStatus,'Control WS: Online',true);stop()};controlWS.onclose=()=>{status(controlStatus,'Control WS: Offline',false);status(serialStatus,'ESP Serial: Unknown',false);relaySerialOnline=false;showPowerStatus('offline');controlReconnectTimer=setTimeout(connectControl,800)};controlWS.onerror=()=>controlWS.close();controlWS.onmessage=e=>{const s=JSON.parse(e.data);if(s.type==='power_result'){showPowerStatus(s.powerStatus);return}if(s.type!=='status')return;relaySerialOnline=!!s.serialConnected;status(serialStatus,'ESP Serial: '+(s.serialConnected?'Online':'Offline'),s.serialConnected);if(s.powerStatus)showPowerStatus(s.powerStatus);else updatePowerButton()}}
    async function waitForIceComplete(connection){if(connection.iceGatheringState==='complete')return;await Promise.race([new Promise(resolve=>{const check=()=>{if(connection.iceGatheringState==='complete'){connection.removeEventListener('icegatheringstatechange',check);resolve()}};connection.addEventListener('icegatheringstatechange',check)}),new Promise(resolve=>setTimeout(resolve,1500))])}
    function stopCameraWatchdog(){clearInterval(cameraWatchdog);cameraWatchdog=null}
    function scheduleCameraReconnect(){clearTimeout(cameraReconnectTimer);cameraReconnectTimer=setTimeout(connectCamera,1500)}
    function resetCamera(){if(cameraWS&&cameraWS.readyState<WebSocket.CLOSING)cameraWS.close();else scheduleCameraReconnect()}
    function startCameraWatchdog(){stopCameraWatchdog();lastVideoTime=video.currentTime;stalledVideoChecks=0;cameraWatchdog=setInterval(()=>{if(!pc||['new','connecting'].includes(pc.connectionState))return;const currentTime=video.currentTime;if(currentTime>lastVideoTime){lastVideoTime=currentTime;stalledVideoChecks=0;return}if(++stalledVideoChecks>=3)resetCamera()},2000)}
    async function startCameraOffer(socket){pc=new RTCPeerConnection({iceServers:ICE_SERVERS,iceTransportPolicy:ICE_TRANSPORT_POLICY});pc.ontrack=e=>{video.srcObject=e.streams[0];status(cameraStatus,'Camera: Online',true)};pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='failed'){status(cameraStatus,'Camera: Offline',false);resetCamera()}else if(['disconnected','closed'].includes(pc.connectionState))status(cameraStatus,'Camera: Offline',false)};pc.addTransceiver('video',{direction:'recvonly'});const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitForIceComplete(pc);if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'camera_offer',sdp:pc.localDescription.sdp,sdpType:pc.localDescription.type}))}
    function connectCamera(){clearTimeout(cameraReconnectTimer);stopCameraWatchdog();if(pc){pc.close();pc=null}const socket=new WebSocket(wsScheme+location.host+'/ws/camera?robotId='+encodeURIComponent(ROBOT_ID));cameraWS=socket;socket.onopen=()=>startCameraOffer(socket).catch(error=>{console.error('camera offer failed',error);status(cameraStatus,'Camera: '+(error&&error.message?error.message:'WebRTC error'),false);socket.close()});socket.onmessage=async e=>{const message=JSON.parse(e.data);if(message.type==='camera_reset'){socket.close();return}if(message.type!=='camera_answer'||socket!==cameraWS||!pc)return;try{await pc.setRemoteDescription({type:message.sdpType,sdp:message.sdp});startCameraWatchdog()}catch(error){console.error('camera answer failed',error);socket.close()}};socket.onclose=()=>{if(socket!==cameraWS)return;stopCameraWatchdog();status(cameraStatus,'Camera: Offline',false);if(pc){pc.close();pc=null}scheduleCameraReconnect()};socket.onerror=()=>socket.close()}
    box.addEventListener('pointerdown',event=>{if(box.setPointerCapture)box.setPointerCapture(event.pointerId);startDrag(event)});box.addEventListener('pointermove',drag);box.addEventListener('pointerup',endDrag);box.addEventListener('pointercancel',endDrag);
    showVelocity();connectControl();connectCamera();if(!gamepadLoopStarted){gamepadLoopStarted=true;requestAnimationFrame(pollGamepad)}
  </script>
</body>
</html>
